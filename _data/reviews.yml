      Oh, my, Ledaig-olph, what a brilliant nose you have! Full of fruity and floral notes. Intense, elegant, ethereal. Some very ripe lemons and melons, elderflower drink, a dash of lavender, a sprinkle of freshly cracked coriander seed and white pepper corns. Complex in the sense of well-integrated, coherent, deep and subtle, not in the sense of many contrasts.
    sipping: >
      ery drinkable at a naturally "low" ABV. Moderately sweet, and definitely full-flavoured. The initial mouthfeel is rather light, but leaves a waxier trace in the finish. The flavours are concordant with the nose: lemons and melons, in the form of sorbets, and sweet dessert wine, Sauternes.
    comments: >
      I was expecting something a bit dirty from Tobermory, but blindly I would have guessed an old Lowlander, perhaps even an Imperial or Littlemill. Needless to say, that's enormous praise. I'm quite excited now that my stash already contains a 25yo, 1995 vintage unpeated Ledaig for which I paid a net price of €180 at auction in 2024.
    grade:
      system: onlyheart-2025
      heart: yes

bruichladdich-21-pst:
  bottle: bruichladdich-21-pst
  date: 2025-12-17
  post: dornoch-25th-anniversary
  market_context:
    availability: Sold out at £175
    estimated_price:
      amount: 175
      currency: GBP
  sample_context:
    desc: from a 2cl sample bottle
    blind: no
  review:
    intro: null
    nosing: >
      There's immediately a very clear grapefruit note on the nose, and a maritime (yet non-smoky) character. We're of on a real adventure of discovery: grapefruit, minerality, iodine, nuts, ginger ale, yeasty apple cider, pine wood (sap), lavender, vanilla... Overall dry and fragrant, one could say.
    sipping: >
      Salty, sweet*, savoury. Arrives pungent, fusile, ashy, before I'm drawn into stone fruits and bitter lemon. I put an asterisk on sweet; it's somehow an illusion that evaporates into a rather dry finish. Drinks well neat, but water rounds it out well, bring back some residual malty sweetness in the finish.
    comments: >
      It's fascinating experience, as a "naked" Islay whisky that has that phenolic and maritime tang, without the peat smoke, and very good indeed in its own right. It is reviving memories of the 21yo Bruichladdich I bought and largely consumed on a Paris business trip four years ago, though this one is more intense and complex as a single cask experience.
    grade:
      system: onlyheart-2025
      heart: yes

islay-33-pst:
  bottle: islay-33-pst
  date: 2025-12-17
  post: dornoch-25th-anniversary
  market_context:
    availability: Sold out at £345
    estimated_price:
      amount: 345
      currency: GBP
  sample_context:
    desc: from a 2cl sample bottle
    blind: no
  review:
    intro: null
    nosing: >
      Fascinating old Islay here. I'm getting, in some sort of unlikely balance, oak aged mezcal, smoked sausage, Savon de Marseille, yeasty Belgian blonde, lots of bright lemon, fish curry with kefir lime. Smoked, sour, herbal, pungent, to summarize.
    sipping: >
      The palate is not as wacky as the nose would seem. There's plenty of fruit-syrup sweetness running through (I'm getting passion fruit, mango and the likes), toffee and vanilla and a little sesame seed oil, a well-integrated and not very invasive peat streak, along with saline and phenolic notes. 
    comments: >
      Juicy well-matured bourbon cask Islay.
    grade:
      system: onlyheart-2025
      score: no

ardbeg-16-pst:
  bottle: ardbeg-16-pst
  date: 2025-12-17
  post: dornoch-25th-anniversary
  market_context:
    availability: Sold out at £150
    estimated_price:
      amount: 150
      currency: EUR
  sample_context:
    desc: from a 2cl sample bottle
    blind: no
  review:
    intro: null
    nosing: >
      Very minerally, coastal nose; sea shells. Star anise, somewhat unripe tropical fruit, green mango, green papaya. Fresh, invigorating, and very appealing. Neither a very young or old feel.
    sipping: >
      It is particularly salty, this one, and sweet-ish. Exotic cocktails: pineapple / pina colada, lime / capirinha. Yes, a little white rum there, and sugar-salted dipped glass. And grilled seafood; smoky and savoury, with a generous squeeze of lemon. Does not give away the fact that it's from a sherry butt in any way.
    comments: >
      Very drinkable, delicious and moorish, I can see why people are drawn to Ardbeg and this profile. In a way, it's a rather uncomplicated dram, so even though it's good, the price does seem very inflated to me.
    grade:
      system: onlyheart-2025
      heart: no

# ------ NcNoch whos there

ncnoch:
  bottle: ncnoch
  date: 2025-12-12
  post: ncnoch-whos-there
  market_context:
    availability: Available around €70
    estimated_price:
      amount: 70
      currency: EUR
  sample_context:
    desc: From 1/3 full bottle
    blind: no
  review:
    intro: null
    nosing: >
      A fresh and grassy nose, also with some fatty, creamy elements. Pine needles, underripe nectarines, banana peel, a little lavender, but also chalk, beeswax, clotted cream, shortbread. There is an anticipation of (pleasant) bitterness; I find the nose very appealing.
    sipping: >
      Powerful arrival on the palate, with a moderately sweet, very malty, chewy, and somewhat salty-savoury foundation, with fruity and grassy top notes, in agreement with the nose. I find the citrus-rind bitterness well balanced.
    comments: >
      A great example of young whisky with character and depth, entirely spirit-driven, and actually offering a positive experience different from a more well-aged whisky. It's not as good as the Sutherland 5yo, or (as I'll reveal next) the Dornoch 5yo cask 140, but all of these are proof that young whisky can be exquisite.
    grade:
      system: onlyheart-2025
      heart: no

ncnoch-px:
  bottle: ncnoch
  date: 2025-12-12
  post: ncnoch-whos-there
  market_context:
    availability: DIY!
    estimated_price:
      amount: 70
      currency: EUR
  sample_context:
    desc: ###
    blind: no
  review:
    intro: Now let's try the PX-laced version. I have added a few drops of a 1965 vintage PX to the whisky in a 10cl bottle that's been resting for several months now.
    nosing: >
      The nose is hard to tell apart from the reference. Perhaps it is a little rounder, less sharp alcohol on the nose. 
    sipping: >
      On the palate, the sweetness is definitely lifted; I've really put in the perfect amount that it does not become sweet in an unnatural way. The muscularity of the spirit also seems lifted, and there's a subtle presence of musty, leathery, and raisiny notes from the PX.
    comments: >
      Overall, I think a small improvement on the reference!
    grade:
      system: onlyheart-2025
      heart: no

dornoch-5-px:
  bottle: dornoch-5-px
  date: 2025-12-12
  post: ncnoch-whos-there
  market_context:
    availability: Sold via ballot for £100
    estimated_price:
      amount: 100
      currency: GBP
  sample_context:
    desc: Bottle kill
    blind: no
  review:
    intro: null
    nosing: >
      Concentrated nose, with juicy blood orange, tangerines, golden sultanas, goat cheese with honey, some heather and earth. Something unique here that's hard to describe!
    sipping: >
      Mouth-filling, sweet, oily, and with a depth of flavour that just envelopes the palate. Orange chocolate, baked kumquats with foie gras, the syrupy juice in the bottom of the bowl of fruit salad, praline.
    comments: >
      This is my Whisky of the Year 2025. Very delicious, and not quite like any other whisky I've had. There's a characterful spirit and a very active cask shooting off tangerine-coloured fireworks together.
    grade:
      system: "onlyheart-2025"
      heart: yes

