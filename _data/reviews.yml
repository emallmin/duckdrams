    sipping: >
      The palate lands rather flat with the low ABV, but in style is true to the nose, playing on herbaceous, piney, and lightly smoky themes. While the taste is not overly sweet, the sweetness that’s there is too sugary. The sherry notes get more play in the medium finish.
