      Smoked cold cuts, burning wood, barn and hay, grapefruit, orange juice, peaches.
    sipping: >
      Very dry, but not in a bad way. Woody and smoky (fresh cut wood, hickory smoke, acorns), hints of iodine and seaweed, slightly burned knäckebröd (Swedish hard bread). Fruitier notes too, with palate cleansing sherbet, some underripe nectarines that linger in a long smoky aftertaste.
    comments: >
      Not at all bad, but I don’t think its quite up to par with, say, Ardnahoe 5yo which has a deeper taste at the same age.
    grade:
      system: "multidim-2025"
      nose_deliciousness: 3.5
      nose_fun_factor: 3
      sip_deliciousness: 3.5
      sip_fun_factor: 3
      
glenallachie-4:
  bottle: glenallachie-4
  date: 2025-10-24
  post: big-pursuit
  market_context:
    availability: €115
    estimated_price:
      amount: 115
      currency: EUR
  sample_context:
    desc: a 3cl sample bottle
    blind: no
  review:
    intro: null
    nosing: >
      Not as powerful as MK5 despite (or because of?) much higher ABV. Smoky – like a smoked cheese. Sandy beach by the sea – salty, iodine. More grapefruit, and vanilla than the MK5. Dried Provençale herbs, and a fresh touch of spearmint.
    sipping: >
      Again, very dry, but there is a robust malty, and fruity base. Just a bit of vomit hick-up… aka peat phenols.
    comments: >
      A showcase of things to come… In my opinion the MK5 is way better, so the price on this one could only be justified by the hype to try peated GlenAllachie for the first time back in 2022. And it ain’t 2022 anymore.
    grade:
      system: "multidim-2025"
      nose_deliciousness: 3.5
      nose_fun_factor: 3
      sip_deliciousness: 3
      sip_fun_factor: 3

glenrothes-15-nss:
  bottle: glenrothes-15-nss
  date: 2024-12-15
  market_context:
    availability: "€140"
    estimated_price:
      amount: 140
      currency: EUR
  sample_context:
    desc: from a 2cl sample bottle
    blind: no
  review:
    intro: null
    nosing: >
      Ripe and bright fruits (passion fruit, pear, citrus) and dessert wine, some minerality with petrichor and a dash of white pepper and vanilla.
    sipping: >
      Very juicy, with loads of yellow fruits; sweet, but not in a sugary or confectionary way. Fairly prominent alcohol neat, but still drinkable. Responds well to water; simple but long finish, with golden sultanas.
    comments:
      before_reveal: >
        A solid “juicy oak” profile whisky, without bells and whistles. I’m very partial to this kind of stuff. Time for the first guess of the season. Single malt, for sure. Bourbon casks with a white dessert wine finish. Age 13yo, abv north of 55%, and distillery I have no clue, but Speyside would be a safe bet . Or could it actually be Irish? Maybe, but I think no.
      after_reveal: >
        Not too shabby guesswork. I would say it’s a little boozy for 52%. Refill sherry makes sense. It’s mostly juicy oak, and a slight wine influence that I interpreted as dessert wine. Pricewise, I’d say the current retail price (was it lower at launch?) is way too high.
    grade:
      system: stoplight-2024
      deliciousness: "⚫⚫🟢"
      fun_factor: "⚫🟡⚫"
      value: "🔴🟡⚫"
      mark:
      punchline: Solid juicy oak

