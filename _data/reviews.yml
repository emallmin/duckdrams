    estimated_price:
      amount:
      currency:
  sample_context:
    desc: 3cl sample bottle
    blind: no
  review:
    intro: null
    nosing: >
      First impression is buttery on the nose. Shortbread biscuits, milk chocolate, but also fruity (red apple?). There's a briney character too. Charred grapefruits and seashells. Not peaty, but slightly smoky and industrial. The latter impressions grow with time and water. 
    sipping: >
      Flavourful, until the alcohol singes the palate. Dirty, and a bit ashy and sulfury, but not too much. Reminds me a lot of Croftengea. Quite decent finish, with rubber giving way to dried mulberries. I want to say butter-fried sage too, but I might be overdoing it.
    comments: >
      Overall, an assertive dram, playing more toward the phenolic than fruity side of BN.
    grade:
      system: "original-2023"
      score: "⭐ Notable Quality"

