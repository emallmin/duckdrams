  review:
    intro: From a comparative review of three grain whiskies.
    nosing: >
      First impression: Pancakes with plenty of syrup; oak wood, cinnamon, and vanilla, a bit perfumed. A generous and enticing nose. Some sour and vegetal notes hiding in the background though.
      
      Second impression: Still close to the initial experience. Maybe a bit more polished wood, and a little less pancakes. Finish is perhaps a bit weak. Next!
    sipping: >
      Flavourful and creamy in taste, but light in texture. Sweet, vanilla finish. Well integrated.
    comments: >
      In total I find the NS 46yo to be good but not fantastic.
