linkwood-24-glmo-2023:
  bottle: linkwood-24-glmo
  date: 2023-03-23
  market_context:
    availability: "I presumably bought the last bottle (£120)."
    estimated_price:
      amount: 120
      currency: "GBP"
  sample_context:
    desc: "Bottle kill."
    blind: no
  review:
    intro: null
    nosing: >
      Golden sultanas, overripe pineapple, rum, liquorice, beeswax, jasmine tea, white pepper, cinnamon, leather, oak.
    sipping: >
      Full and mouth-coating, malty-sweet, with a distinct bitterness that’s typical of Linkwood. Orange marmalade, dried mulberries and gooseberries. 
      Not overly complex, but delicious. Longish finish with gooseberry and tropical fruit.
    comments:
    grade:
      system: "Legacy"
      score: "⭐Notable Quality"
      wb_score: 89


inchmurrin-23-lt-2023:
  bottle: inchmurrin-23-lt
  date: 2023-10-04
  market_context:
    availability: "Unavailable. Estimated retail price €160"
    price:
      amount: 160
      currency: "EUR"
  sample_context:
    desc: "Sample bought from bottler at Bad Homburg Whisky Fair 2023 (2cl, €7 I think)"
    blind: no
  review:
    nosing: >
      Predominantly fruity on the nose. Ripe yellow apples, golden sultanas, some rosewater, subtle woodchip smoke. 
      Characteristic bourbon cask notes of vanilla and cream.
    sipping: >
      The palate is somewhat dry, the taste contains stone fruits and a hint of ash,
       and is slightly pungent (like overripe fruit, or fruit punch). The finish is long and satisfying with stone fruits and gooseberry.
    comments: >
      Surprisingly, I’m most excited about the finish here. Usually, I’m more captivated by the nose, or the palate. 
      It’s a great bourbon-casky dram, not so complex, but definitely tasty. I personally wouldn’t go out of my way to obtain a bottle, though.
    grade:
      system: "Legacy"
      score: "Great Quality ⭐"

inchmurrin-24-chwh-2023:
  bottle: inchmurrin-24-chwh
  market_context:
    availability: "Original price £115 (UK, 2021). Currently available for €200 (via Italy, 2023)"
    price:
      amount: 115
      currency: "GBP"
  sample_context:
    desc: "Review sample bought from Hop/Scotch (UK) (25ml, £11)"
    blind: no
  review:
    intro: >
      I will review this one by comparison to the first. Once more yellow apples, stone fruits – but less intense.
    nosing: >
      The nose is more ethereal, wet linen and light white wine come to mind. Less vanilla, but more milk chocolate.
    sipping: >
      The palate is very well balanced in terms of flavours, but in the taste there is the unmistakable cardboard storage-defect note. 
      Not to the point of ruining the whole experience, though. Again, the finish is lovely, with gooseberry and sultanas.
    comments: >
      I have had this sample for 6 months, and it may have been bottles a few months before then. Clearly, this was too long, 
      but I still feel confident that this dram, under optimal conditions, would be nice but not amazing in my book.
    grade:
      system: "Legacy"
      score: "Inconclusive (tainted sample)"



convalmore-20-sv-2025:
  bottle: convalmore-20-sv
  date: 2025-11-16
  market_context:
    availability: "Estimated €250 at auction"
    estimated_price:
      amount: 250
      currency: EUR
  sample_context:
    desc: "2cl sample bottle"
    blind: no
  review:
    intro: null
    nosing: >
      Bright, floral, and fruity. Peach and papaya, melon, rose water, coriander seed, lots of wax. 
      Nothing modern ever smells like this! Old bottle effect?
    sipping: >
      Mild on the palate, silky and rather sweet, hint of bitter citrus rind. Predominantly cereal grains, 
      buttered toast, with some waxy and floral notes, camomile tea, fresh grass. A little old and stale, but not in a bad way.
    comments: >
      Interesting, because it’s very non-modern, by some combination of old bottle effect and a profile that’s out of fashion 
      (from a closed distillery, after all). The light floral and waxy notes are intriguing. But in the end, not so complex, 
      and not showing much age and action form the cask.
    grade:
      system: "multidim-2025"
      nose_deliciousness: 3.5
      nose_fun_factor: 4
      sip_deliciousness: 3.5
      sip_fun_factor: 3


ben-wyvis-31-sv-2025:
  bottle: ben-wyvis-31-sv
  date: 2025-11-16
  market_context:
    availability: "Rare and variable at auction, €700-1400 (would expect €800 today)"
    estimated_price:
      amount: 800
      currency: EUR
  sample_context:
    desc: "2cl sample bottle"
    blind: no
  review:
    intro: null
    nosing: >
      Lucious, sweet tropical fruits. coconut, peach, fruit jelly, old cognac, and also perfumy flowers. 
      Sweet and fatty brioche bun. Old leather.
    sipping: >
      Very flavour-intense and fatty, oily; like fresh wine gums. Lots of esters – candy and ripe fruits galore, 
      floral honey. Besides, there’s lots of toffee and butterscotch. A subtle trace of smoke. Exceedingly long, oily finish.
    comments: >
      An experience indeed, a fruity intensity and oiliness one very rarely finds. It is a stellar whisky, but today it 
      somehow didn’t manage to bring me all the way to a ❤️, but on a different day it might have.
    grade:
      # system: "Legacy"
      system: "multidim-2025"
      nose_deliciousness: 4
      nose_fun_factor: 3.5
      sip_deliciousness: 4
      sip_fun_factor: 4


old-school-malt-31-sv-2025a:
  bottle: old-school-malt-31-sv
  date: 2025-04-05
  market_context:
    availability: "In stock at €350"
    estimated_price:
      amount: 350
      currency: EUR
  sample_context:
    desc: "From a 2cl sample bottle."
    blind: yes
  review:
    intro: null
    nosing: >
      Outrageously fruity, like hot strawberry cordial (“jordgubbssaft”), and with the classic fresh-baked cinnamon bun right there. Beyond this first impression, the nose turns more exotic: banana, pear, and passion fruit, coconut and a streak of asian mint, hardwoods, a little tiger balm.
    sipping: >
      The intensity of the flavour matches the nose, but beyond rich fruits we are introduced to malty and biscuity notes, even porter, and soft cigar notes. Indeed, it is quite beer-y. Savoury-sweet, substantial, and a little salty. Long finish.
    comments: 
      before_reveal: >
        This is a truly spectacular dram! These 2cl aren’t nearly enough to explore and make complete sense of this beauty — especially as it is so incredibly delicious, one just wants to sip and sip. Not only a clear ❤️ but a standout among favourites. I can hardly believe this one will be topped in this tasting. As for guesswork, I don’t have much to say except there’s some sherry involvement, and I wouldn’t be surprised as blended malt or single malt, either way. A €300 bottle price tag is not unreasonable for this level of experience.
      after_reveal: >
        Aha! I recognize this one from when it hit the market some months ago. What I didn’t realize then is that it contains malt from 104 Scotch distilleries, which has been marrying in sherry butts for 26 years producing 1148 bottles. It’s a bit strange. Were there many cask dregs joined together, and then the idea was born to have a bottling with almost every distillery? So some contributions are probably just teaspoons, and others have more bulk. There’s less than 8L on average per distillery in the batch.
    grade:
      system: "stoplight-2024"
      deliciousness: "⚫⚫🟢"
      fun_factor: "⚫⚫🟢"
      value: "⚫🟡⚫"
      punchline: Outrageously delicious
      mark: "❤️"

bunnahabhain-30:
  bottle: bunnahabhain-30
  date: 2025-04-05
  market_context:
    availability: round €600 shop/auction
    estimated_price:
      amount: 600
      currency: EUR
  sample_context:
    desc: from a 2cl sample bottle
    blind: yes
  review:
    intro: null
    nosing: >
      Very chocolaty — like a naturally fruity dark chocolate — and full of red fruits (ripe red delicious apple variety, cherries), figs, toasted and sugar-coated almonds, marshmallow, some cold cuts, a twig of rosemary, and an espresso to finish off. Dried fruits, pineapple in finish.
    sipping: >
      Savoury, meaty, sweet, big, nice engagement of tannins. The sweetness comes first, with soaked sponge cake, caramelized nuts, and then a puff of smoke blooms forward, subsiding to leave more biscuity and dried fruit notes behind.
    comments:
      before_reveal: >
        Very nice and muscly sherry dram, where cask and spirit are in perfect sync. Could be Mortlach, or some other heavy Speysider. Feels like we’re above 50% here. It’s a great dram, but I’m a less excited than the first; unfair to be up against such competition, though. Still a ❤️!
      after_reveal: >
        A pleasure and an honor, sir. Great to add this review of the 30yo, to previous review of the 12, 18, 25yo. Already the splendid 25yo is exceeding budgetary limitations, and here we have almost doubled that, for an extra 5 years. Side by side, I’m not even sure the 30yo would win.
    grade:
      system: "stoplight-2024"
      deliciousness: "⚫⚫🟢"
      fun_factor: "⚫⚫🟢"
      value: "🔴⚫⚫"
      punchline: Moreish muscleman
      mark: "❤️"

glen-keith-29-mmd:
  bottle: glen-keith-29-mmd
  date: 2025-05-04
  market_context:
    availability: Available for €320
    estimated_price:
      amount: 320
      currency: EUR
  sample_context:
    desc: from a 2cl sample bottle
    blind: yes
  review:
    intro: null
    nosing: >
      Very fragrant, again also fruity (yellow apples, especially; calvados), but with some earthy, and minerally notes in there; somehow more brooding and melancholic. Some sourness, lemon, or even lactic acid. Dried fruits and nuts, and to add that mysterious element, lemongrass and curry. With time gets a bit farmy.
    sipping: >
      Medium-sweet, orange, pineapple, dried fruits and nuts, a very dry sherry note, a musty cheese, leather, some oak wood. Not the longest finish.
    comments:
      before_reveal: >
        It’s another belter dram, with deliciousness and mystique. Could be a Springbank?❤️
      after_reveal: >
        Sure, I had some old and mellow Springbanks, but I’ve got to stop guessing for it all the time in blind tastings now!
    grade:
      system: "stoplight-2024"
      deliciousness: "⚫⚫🟢"
      fun_factor: "⚫⚫🟢"
      value: "⚫🟡⚫"
      punchline: Melancholic calvados and curry
      mark: "❤️"

auchentoshan-22-sv:
  bottle: auchentoshan-22-sv
  date: 2025-04-05
  market_context:
    availability: Available for €330
    estimated_price:
      amount: 330
      currency: EUR
  sample_context:
    desc: from a 2cl sample bottle
    blind: yes
  review:
    intro: null
    nosing: >
      At first a very strong note of tasted hazelnut, bit of cognac, ancient rug. Water is needed to tame the intensity of the nose. Buttery sherry notes predominate, but we also het fragrant herbs, a squeeze of lemon, and some cigarette.
    sipping: >
      Sweet, oily, active taninns, feinty beneath the layers of sherry and fruit cake, some coffee. Some kinds of seeds?
    comments:
      before_reveal: >
        It’s bold, things are happening, everything is tasty, it has more complexity than the typical sherry bomb in its teens. But it’s maybe even a bit too much, or lacking in a really interesting contrast to be honest.
      after_reveal: >
        Yeah, something like that was to be expected.
    grade:
      system: "stoplight-2024"
      deliciousness: "⚫⚫🟢"
      fun_factor: "⚫🟡⚫"
      value: "🔴🟡⚫"
      punchline: Gone hazelnuts
      mark:

glenrothes-26-sv:
  bottle: glenrothes-26-sv
  date: 2025-04-05
  market_context:
    availability: Available for €310
    estimated_price:
      amount: 310
      currency: EUR
  sample_context:
    desc: from a 2cl sample bottle
    blind: yes
  review:
    intro: null
    nosing: >
      Once more, we have a oozing sherry and hazelnut profile on the nose immediately. There’s some charred wood, and vanilla. Needs water, which brings out some fresh grapefruit, tart lingonberry jam, papaya.
    sipping: >
      Sweet, and oily, chewy. Lots of muscovado sugar, rum-raisins, and a quite feisty spirit underneath.
    comments:
      before_reveal: >
        I like this marginally more than the previous one, as it has little bit more going on with the charred and the tropical notes. Single malt Speyside/Highland to be sure.
      after_reveal: >
        This looks *dark*. People go nuts over super-dark sherry releases.
    grade:
      system: "stoplight-2024"
      deliciousness: "⚫⚫🟢"
      fun_factor: "⚫🟡🟢"
      value: "🔴🟡⚫"
      punchline: Oozing sherry
      mark:

laphroaig-25:
  bottle: laphroaig-25
  date: 2025-04-05
  market_context:
    availability: Available at €480
    estimated_price:
      amount: 480
      currency: EUR
  sample_context:
    desc: from a 2cl sample bottle
    blind: yes
  review:
    intro: null
    nosing: >
      A stream of consciousness: smoked butter, rosé pepper, white pepper, noori, flower petals (violets), salty beach pebbles, charred lemon, pears, peach, fermented ginger, golden syrup, beeswax.
    sipping: >
      Fresh, coastal, invigorating; yellow fruits, but not very sweet.
    comments:
      before_reveal: >
        A beautiful old Islay. Caol Ila, is my best bet. It has many of the qualities I adore with my favourite, Bruichladdich (although I don’t think there’s much stock of this high age floating about). What the heck, this is favourite material.
      after_reveal: >
        Hmm, its not so in-your-face as one has come to expect from Laphroaig. I guess the age rounds off the peat.
    grade:
      system: "stoplight-2024"
      deliciousness: "⚫⚫🟢"
      fun_factor: "⚫🟡🟢"
      value: "🔴⚫⚫"
      punchline: Summer winds of Islay
      mark: "❤️"


