cameronbridge-39-mom:
  bottle: cameronbridge-39-mom
  date: 2023-03-23
  post: trio-of-old-grains
  market_context:
    availability: "£150-200 in the UK"
    estimated_price:
      amount: 175
      currency: GBP
  sample_context:
    desc: from a 3cl sample bottle
    blind: no
  review:
    intro: From a comparative review of three grain whiskies.
    nosing: >
      First impression: At first very closed, making it seem mostly chalky and dunnage-y. A bit buttery, some confectionary notes developing, but the woody and vegetal notes are more pronounced here than in the NoS. Wood spice, polished wood, almost sour wood too.

      Second impression: Ooh, here’s more sweet pastry than I remember from earlier. Not as closed as at first, and less vegetal. Some milk chocolate. A faint trace of a leathery note (more please!). But the main experience is still wood. The sourness is less vinegary and more citric now. Now the nose is sort of nice, actually, if a bit too woodsy.       
    sipping: >
      First impression: Palate has some zing! compared to NoS, and more texture. Drying and a bit sour. Orange marmalade, maybe some stewed apples – but not very sweet. Finish is quite oaky, with tannins.

      Second impression: still tannic… very tannic – there’s an astringent coating on the teeth. Not great.
    comments: >
      The CB 39yo and the blended grain 45yo are too unbalanced by the wood to be more than decent, but they are certainly not dull. 
    grade:
      system: "original-2023"
      score: "✔️ Decent"

