      First impression on the nose is herbaceous and perfumed/musky; then juicy steak with café de Paris butter, and pickle brine. There is an initially grassy note that turns into meadow, as water reveals floral notes not initially present.
    sipping: >
      In the palate that the peat becomes prominent and combines with the herbal accent into a tobacco and cigar flavour, along with some tomato vine and a chlorine note. The finish is quite drying, but with a satisfying herbal flavour.
    comments: >
      This whisky made me <em> feel </em> something: like I was standing alone in a Swedish summer meadow late at night. I wasn’t too far from shedding a tear out of some diffuse nostalgia. The whisky is earthy and a bit raw — not what I usually go for — but if I had a bottle to enjoy over time, it could become a personal favourite.
