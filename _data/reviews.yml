cambus-24-tbwc:
  bottle: cambus-24-tbwc
  date: 2020-09-16
  post: a-comparison-of-cambi
  market_context:
    availability: €75 (50cl)
    estimated_price:
      amount: 75
      currency: EUR
  sample_context:
    desc: "25ml for £7 bought at MoM"
    blind: no
  review:
    intro: null
    nosing: >
      Truffle! (The mushroom, not chocolate.) A distinct lemon fragrance, but more like from a cleaning agent than the actual fruit. I’m lead via some spice notes (white pepper, coriander seeds) into dusty-woody-mouldy territory (hemp, oak, dunnage warehouse, dry walnuts). The alcohol pokes my nostrils a bit. With time in the glass, overripe fruits/vegetables come to the fore (foremost pineapple, also avocado and sweaty onion). The fragrance notes may sound queer, but it’s a queerness that works. In a word, this is <em>funky</em>. 
    sipping: >
      Now for the taste. Wow, such silky texture; a little alcohol nip and spiciness arrives in the development, though. The flavour is unmistakably of clementine, wax and vanilla. These flavours linger in the finish, along with a fresh, mentholic bitterness, like the white of citrus peel, but not too much. The funk is more on the nose than the palate, which I’d say works for the best.
    comments: >
      Such an interesting whisky, with a nose one can easily dig around in for half an hour before even taking a sip. And then one is greeted with such a waxy, and delicate experience on the palate. This is one of the most worthwhile whiskies I’ve tried this year! And certainly the best grain whisky I can recall trying (but it’s not more than a dozen or two).
    grade:
      system: categorical-2023
      score: "⭐ Enthusiast’s Choice ❤️ Personal Favourite"
      heart: yes

