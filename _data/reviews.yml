old-school-malt-31-sv-2025a:
  bottle: old-school-malt-31-sv
  date: 2025-04-05
  post: 31-30-29-22-26-25
  market_context:
    availability: "In stock at €350"
    estimated_price:
      amount: 350
      currency: EUR
  sample_context:
    desc: "From a 2cl sample bottle."
    blind: yes
  review:
    intro: null
    nosing: >
      Outrageously fruity, like hot strawberry cordial (“jordgubbssaft”), and with the classic fresh-baked cinnamon bun right there. Beyond this first impression, the nose turns more exotic: banana, pear, and passion fruit, coconut and a streak of asian mint, hardwoods, a little tiger balm.
    sipping: >
      The intensity of the flavour matches the nose, but beyond rich fruits we are introduced to malty and biscuity notes, even porter, and soft cigar notes. Indeed, it is quite beer-y. Savoury-sweet, substantial, and a little salty. Long finish.
    comments: 
      before_reveal: >
        This is a truly spectacular dram! These 2cl aren’t nearly enough to explore and make complete sense of this beauty — especially as it is so incredibly delicious, one just wants to sip and sip. Not only a clear ❤️ but a standout among favourites. I can hardly believe this one will be topped in this tasting. As for guesswork, I don’t have much to say except there’s some sherry involvement, and I wouldn’t be surprised as blended malt or single malt, either way. A €300 bottle price tag is not unreasonable for this level of experience.
      after_reveal: >
        Aha! I recognize this one from when it hit the market some months ago. What I didn’t realize then is that it contains malt from 104 Scotch distilleries, which has been marrying in sherry butts for 26 years producing 1148 bottles. It’s a bit strange. Were there many cask dregs joined together, and then the idea was born to have a bottling with almost every distillery? So some contributions are probably just teaspoons, and others have more bulk. There’s less than 8L on average per distillery in the batch.
    grade:
      system: "stoplight-2024"
      deliciousness: "⚫⚫🟢"
      fun_factor: "⚫⚫🟢"
      value: "⚫🟡⚫"
      punchline: Outrageously delicious
      mark: "❤️"

bunnahabhain-30:
  bottle: bunnahabhain-30
  date: 2025-04-05
  post: 31-30-29-22-26-25
  market_context:
    availability: round €600 shop/auction
    estimated_price:
      amount: 600
      currency: EUR
  sample_context:
    desc: from a 2cl sample bottle
    blind: yes
  review:
    intro: null
    nosing: >
      Very chocolaty — like a naturally fruity dark chocolate — and full of red fruits (ripe red delicious apple variety, cherries), figs, toasted and sugar-coated almonds, marshmallow, some cold cuts, a twig of rosemary, and an espresso to finish off. Dried fruits, pineapple in finish.
    sipping: >
      Savoury, meaty, sweet, big, nice engagement of tannins. The sweetness comes first, with soaked sponge cake, caramelized nuts, and then a puff of smoke blooms forward, subsiding to leave more biscuity and dried fruit notes behind.
    comments:
      before_reveal: >
        Very nice and muscly sherry dram, where cask and spirit are in perfect sync. Could be Mortlach, or some other heavy Speysider. Feels like we’re above 50% here. It’s a great dram, but I’m a less excited than the first; unfair to be up against such competition, though. Still a ❤️!
      after_reveal: >
        A pleasure and an honor, sir. Great to add this review of the 30yo, to previous review of the 12, 18, 25yo. Already the splendid 25yo is exceeding budgetary limitations, and here we have almost doubled that, for an extra 5 years. Side by side, I’m not even sure the 30yo would win.
    grade:
      system: "stoplight-2024"
      deliciousness: "⚫⚫🟢"
      fun_factor: "⚫⚫🟢"
      value: "🔴⚫⚫"
      punchline: Moreish muscleman
      mark: "❤️"

