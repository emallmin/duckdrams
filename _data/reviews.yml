      currency: EUR
  sample_context:
    desc: 4cl sample bought from HomeOfMalts
    blind: no
  review:
    intro: null
    nosing: >
      Smells like pine wood and forest floor; green apples and unripe mango, cut green grass — overall quite green and sour notes. I smell walnuts and cooked vegetables that sit a bit uneasily with a prominent vanilla.
    sipping: >
      As compared to the 12yo, there is more vibrancy in the palate, but it is relying mostly on piney and tart flavours, with some sweetness that is not well integrated. A light peat is there and grows over time together with a bitter taste.
    comments: >
      With the wide selection of whisky out there, I can’t see why we should ever choose this one. The rough, woody, green, sour notes are not unpleasant, and at first even fun to engage with, but they quickly become tedious and the dram does not sustain my interest or enjoyment.
