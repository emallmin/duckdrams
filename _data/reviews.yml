    sipping: >
      On the palate, the arrival is intense; vinous, unctuous, then with menthol and some tannins in the development. It draws more towards dry than sweet, but there is a feigned sweetness from the sherry flavours present (caramel, chocolate, dried red fruits, leather). There is also a hint of rubber.
