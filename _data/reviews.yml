    estimated_price:
      amount: 90
      currency: GBP
  sample_context:
    desc: Bottle kill
    blind: no
  review:
    intro: null
    nosing: >
      On first whiff a little boozy with the high ABV, but then the sherry bomb explodes! Toffee, coffee beans, and sherry-steeped strawberry laces. Quite creamy, even buttery. 
    sipping: >
      Intense, with a rather chewy and oily texture. There’s salted caramel, fruit leather, and candied oranges. In the development and finish, I get more of the “funky” notes, and a lingering tobacco (cigar) taste. With a bit of water, some mineral and citrusy notes whisper. 
    comments: >
       Overall, a sherry-bomb with a funky side that really makes all the difference here.
    grade:
      system: "original-2023"
      score: "❤️ Personal Favourite"
      punchline: Sherry-steeped strawberry laces

