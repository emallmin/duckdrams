  market_context:
    availability: "Unavailable. Estimated retail price €160"
    price:
      amount: 160
      currency: "EUR"
  sample_context:
    desc: "Sample bought from bottler at Bad Homburg Whisky Fair 2023 (2cl, €7 I think)"
    blind: no
  review:
    nosing: >
      Predominantly fruity on the nose. Ripe yellow apples, golden sultanas, some rosewater, subtle woodchip smoke. 
      Characteristic bourbon cask notes of vanilla and cream.
    sipping: >
      The palate is somewhat dry, the taste contains stone fruits and a hint of ash,
       and is slightly pungent (like overripe fruit, or fruit punch). The finish is long and satisfying with stone fruits and gooseberry.
    comments: >
      Surprisingly, I’m most excited about the finish here. Usually, I’m more captivated by the nose, or the palate. 
      It’s a great bourbon-casky dram, not so complex, but definitely tasty. I personally wouldn’t go out of my way to obtain a bottle, though.
    grade:
      system: "Legacy"
      score: "Great Quality ⭐"

