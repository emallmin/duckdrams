  review:
    intro: null
    nosing: >
      Quite gingery and peppery, but otherwise fruit-drive, with orchard fruits like apples and pears, some melon. Some coffe beans, and fresh cream.
    sipping: >
      Sweet, full-bodied and densely flavoured along the lines of the nose: dried peach and mango to the fore, then lots of spicy oak and considerable grassiness; the pepperiness of a virgin olive oil. Rather savoury, umami-laden, actually, but in fruity and malty way; it's a very "clean" profile, though some mildly leathery notes are hinted at in the finish, and just a bit bitter.  
    comments:
      before_reveal: >
        All the signs of a 20 or even 30yo "slow matured" Speyside or Lowland whisky. I'd go for a mellow (possibly refill) sherry cask, though it could be ex-bourbon. I'm very partial to that profile, and this is a delicious dram, though no where near the upper echelons; the pepperiness is a bit much, and there really is rather little otherwise distinctive about this within the old & slow category.

        I'm hoping it's not the Littlemill, because I'm hoping for one that will melt my heart, and this one doesn't. Could be Rosebank.
      after_reveal: >
        a#
    grade:
      system: "three-tier-2026"
      score: ###

