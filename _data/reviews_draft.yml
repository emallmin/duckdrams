  sample_context:
    desc: ###
    blind: no
  review:
    intro: null
    nosing: >
      A little timid at first, but also rather interesting. Earhty, buttery, and a litte stale, or just very few bright notes cutting through. Light soy and mushroom, prunes, macadamica nuts, brioche, sage.

      Second time around it is a bit less stuffy, with some orange coming through, banana bread, and a bit of alcohol zing. 
    sipping: >
      That is incredibly dense and silky in texture. Orange marmalade and chocolate in the arrival, then blooms out into tobacco and god-honest proper rancio, finishing lastly on the smooth chocolatey / cocao-butter side.

      Second time I'm feeling "incredibly dense and silky" is a bit of an overstatement, but certianly a creamy mouthfeel. Flavour notes remain on point basically, would add caramel.       
    comments: >
      Definitely a sherry cask, and the stuffy and tobacco-y notes do suggest some age to boot. But it also reminds me a lots of an Octave Dalmunach I had, which punched way above its age. So I'm ready to believe almost anything., but would guess it's nearer to 20 than 10. Highland, most likely. Let's have a look at the list.

      Hard to say. Maybe the Glen Moray 16, or the Tobermory 24. 
    grade:
      system: "three-tier-2026"
      score: ###


