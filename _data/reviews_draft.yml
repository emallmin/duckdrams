    desc: ###
    blind: no
  review:
    intro: null
    nosing: >
      On the first try: Fruit bomb! Clementines in particular, peach, honey, bouquet of flowers... The nose just takes me back in time. Nosing two months later (with some aeration): lots of citrus fruits still, also getting toasted hazelnuts, hay and some farminess, chalk, and lactic action.
    sipping: >
      On the first try: Quite spicy, prickly. Oily, sweet, fruit syrupy. Multivitamin juice, squirt of lime. Juicy bourn-caky finish. Two months later: Less boozy, for sure. Behind the bright, zesty fruits, there's a farmy, cheesy note, and earthiness and cigar smoke, that bumps the complexity an interest up a notch.
    comments: >
      First impression: From the nose I felt like I should have bought 3 bottles! Then on the palate I was less convinced. Second impression: more balanced, more complex, considerable improvement. If only a little less sharp, it would be splendid. I'll enjoy the one bottle for the €158 I paid.
    grade:
      system: "three-tier-2026"
      score: ###

