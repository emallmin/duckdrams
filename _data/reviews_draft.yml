    nosing: >
      Sherried, but not so sweet; rather earthy, intead. Oxidized sherry, kiwi, touch of leather and dirt road, heather, and herbs.
    sipping: >
      Sweet and salty, with a robust spirit; salted caramel, honeycomb, nuts, sultanas, and more herbal and a touch smoky in the finish.   
    comments:
      before_reveal: >
        Not very confident in my tasting notes; it was chaning a lot with water, and I would need a bigger sample to converge in my description. Nonetheless, nothing contradicts a Scotch single malt, and I might even venture to guess it could be a Highland Park at the low end of peating. Or else a Highlander, like Glendronach.
