    blind: no
  review:
    intro: null
    nosing: >
      Well-integrated nose with confectionary and fruity themes: ginger ale, orange marmalade, pecan nut pie, a little banana. Not heavily vanilla-laden, though. A little seaside air to add.
    sipping: >
      Very silky and luxurious texture; boozy and prickly elements are thankfully restrained. Pancakes with maple syrup, orange chocolate, and old-school sherry armoas of leather arm couch, rancio, and somwhere a fragrant cigar is fuming. More tropical fruits; dried mango and the like in the late finish.  
    comments:
      before_reveal: >
        This is very close to the archetype of a well-matured old-school single malt. Say around 25 years, perfectly integrated sherry cask. Alcohol could be anywhere from 43-50%, but whatever it is, is just where it should be. I did not add any water. There is really nothing bad to say about this whisky. Though if it is close to an archetype, it is also not very unique, but not every whisky needs to be. Maybe Banff or Millburn?
      after_reveal: >
        ah
    grade:
      system: "three-tier-2026"
      score: ⁎⁎

