  review:
    intro: null
    nosing: >
      Sticky toffee, cola sauce, ginger ale all the jazz, with some spreitely orange poking through. And.. shellfish? That is, a slight minerality. And a smidge of hessian, dunnage. And perhaps a little sweaty sock. Just a bit. Mostly cola, though, I promise! ... The empty glass smells lovely; like how dark chocoalte with pieces of nuts and dried fruits tastes.
    sipping: >
      It's a actually quite satisfying in terms of strength and texture. Robust spirit, malty, dried fruits, sugared almonds, spices this way and that; generally high-quality non-overbearing sherry notes, but they're meaty in a satisfying way. Thereto whiffs of smoke, and a very slight metallic and mineral note.
    comments: >
      Best of the bunch. Was it so simle back then? Good sherry casks for 12 years and this is what you get?
    grade:
      system: "three-tier-2026"
      score: ⁎

