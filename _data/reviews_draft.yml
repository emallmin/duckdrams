        <em>Completely</em> blindly, I would have placed a lot of money on Bowmore. This is unquestionably the Brora of the bunch. It's very delicious, it's flawless, I'd lap up a bottle of this in no time. But is it the Brora to end all Broras? I think not. That is, I'm not floored, even though I'm purring.  
