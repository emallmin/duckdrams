mystery-malt-3-yellow: #yellow dot
  bottle: ###
  date: ###
  market_context:
    availability: ###
    estimated_price:
      amount: ###
      currency: ###
  sample_context:
    desc: ###
    blind: no
  review:
    intro: null
    nosing: >
      <em>Neck pour.</em> Luciously fruity: pear drops, grapefruit, pomelo, and overripe, estery tropical fruit, even a hint of Hampden. Thick and fatty, buttery, vanilla-laced. Rather sooty and dunnage-y, perhaps even flinty, to boot.

      <em>A few days later.</em> Still fruits galore (green apples!) but I am noticing the minerality more than before. First try I wavered between waxy and buttery, and chose the latter; today it's the former. Smelling the empty glass is enchanting: cereals, litchi, elderflower, pebbles.   
    sipping: >
      Very chewy, oily, BIG. Tutti-frutti candy transitioing to tobacco leaf and herbal, heathery notes, but leaving these rich cask-y notes in the aftertaste.
    comments:
      before_reveal: >
        This is liquid gold. Totally the profile I'm most into these days, and both the nose and the taste is absolutely gorgeous. Had I paid €200 for the bottle (a bit more than the €70, give or take, I did pay) I'd still be happy. 
        
        Wihtout looking at the list of possibilities for Series 3 - what is is? Ben Nevis? Craigellachie? Clynelish? Teaninich? Dornoch? Or some Speysider? Maybe a really good Highland Park? It's bound to be one of my favs. I'll place my guess according to the above order. I would say 16 years and up. Certainly ex-bourbon, and a very active cask to boot. 

        Most likely the Craigellachie 15, or else one of the older Clynelishes. Teaninich or "Highland" is not inconceivable.
    grade:
      system: "three-tier-2026"
      score: "⁎⁎"


