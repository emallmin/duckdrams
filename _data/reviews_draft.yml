    desc: ###
    blind: no
  review:
    intro: null
    nosing: >
      Once it opens up there's an appealing mix of orchard fruits (baked apples, pears, melon), confectionary notes (pastry, cinnamon, prunes), and coastal spray (some minerality) and a whiff of smoke.
    sipping: >
      Sweet and full-bodied, thick texture. Flavours in line with the nose; orchard fruit, though a bit more unripe and green w, confectionary sweetness, and a bit of brine with some smoke in the finish.
    comments: >
      It's well-made whisky. I'm getting the fruitiness I like of Glen Elgin and Linkwood, even with that tad of grassiness and bitterness the latter can have, with more of the coastal profile of Clynelish or Oban. Actually, it was morphing quite a bit with time, and I feel I needed more than 4cl to fully appreciate it - that's a good sign.
    grade:
      system: "three-tier-2026"
      score: ###

