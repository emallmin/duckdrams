    desc: ###
    blind: no
  review:
    intro: null
    nosing: >
      Summarizing my impressions from three separate tasting occasions, there's zesty citrus (grapefruit), a slightly perfumed floral quality, crispness and minerality of a Riesling, strawberry dipped in white chocolate, and some denser coconutty bourbon cask notes. Maybe some wax if you go looking for it. It is a really good nose.
    sipping: >
      The second time I tried it (at which point it had had some areation and rest) I discovered a very lucid passion fruit note; also weeks later in my final sampling. Sweet, and both a bit bitter and salty but in a delicious way. Grapefruit or pomelo, roses, and a herbal streak. Also a bit hot neat, improves with water, though a pepperiness remains. The finish is excellent, though, with a classical bourbon cask gooseberry note and a waxiness lingering for a long time. 
    comments: >
      This one has plenty of character and dimensionality. Spirit-driven yet with an active cask. I would be very happy to have a bottle of this. Final score 87
    grade:
      system: "three-tier-2026"
      score: ###

